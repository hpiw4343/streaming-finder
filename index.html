<style>
  :root {
    color-scheme: light;
    --orient: #005187;
    --midnight: #003366;
    --amber: #FFC10E;
    --amber-soft: #FFF4D1;
    --blue-soft: #E6F0F7;
    --ground: #F3F6F9;
    --paper: #FFFFFF;
    --ink: #111111;
    --muted: #4A4F55;
    --line: #C9D3DC;
    --free: #1C6B3A;
    --free-soft: #E3F2E8;
  }
  * { box-sizing: border-box; }
  html { font-size: 20px; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: Lato, Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.55;
    padding-inline: 16px;
    padding-block: 0 48px;
  }
  .wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 24px; }
  header.brand {
    background: var(--paper);
    border-bottom: 5px solid var(--amber);
    margin-inline: -16px;
    padding: 16px;
    display: flex; justify-content: center;
  }
  header.brand img { width: 170px; height: auto; display: block; }
  h1, h2, h3 { font-weight: 900; color: var(--orient); text-wrap: balance; margin: 0; line-height: 1.2; }
  h1 { font-size: 1.9rem; }
  h2 { font-size: 1.5rem; }
  h3 { font-size: 1.2rem; }
  p { margin: 0; max-width: 62ch; }
  .panel {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 24px;
    display: grid; gap: 20px;
  }
  .lead { font-size: 1.1rem; }
  .muted { color: var(--muted); }
  .facts { display: grid; gap: 12px; padding: 0; margin: 0; list-style: none; }
  .facts li { display: flex; gap: 12px; align-items: flex-start; }
  .facts li::before {
    content: ""; flex: 0 0 14px; height: 14px; margin-top: 8px;
    border-radius: 50%; background: var(--amber); border: 2px solid var(--orient);
  }
  button { font: inherit; cursor: pointer; }
  .btn {
    min-height: 64px; padding: 14px 28px; border-radius: 12px;
    font-size: 1.1rem; font-weight: 900; border: 3px solid transparent;
  }
  .btn-go { background: var(--amber); color: var(--ink); border-color: #D9A200; }
  .btn-go:hover { background: #FFCD3C; }
  .btn-go:disabled { background: #E5E5E5; color: #6B6B6B; border-color: #CFCFCF; cursor: not-allowed; }
  .btn-back { background: var(--paper); color: var(--orient); border-color: var(--orient); }
  .btn-back:hover { background: var(--blue-soft); }
  .btn:focus-visible, .opt:focus-visible, select:focus-visible, summary:focus-visible {
    outline: 4px solid var(--midnight); outline-offset: 3px;
  }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .row.split { justify-content: space-between; }

  .progress { display: grid; gap: 8px; }
  .progress-label { font-weight: 700; color: var(--orient); }
  .bar { height: 14px; border-radius: 7px; background: var(--blue-soft); overflow: hidden; border: 1px solid var(--line); }
  .bar span { display: block; height: 100%; background: var(--orient); transition: width .3s; }

  .hint {
    display: inline-block; background: var(--amber-soft); border: 2px solid var(--amber);
    border-radius: 8px; padding: 4px 12px; font-weight: 700; font-size: .95rem;
  }
  .opts { display: grid; gap: 12px; }
  .opt {
    display: flex; gap: 16px; align-items: center; text-align: left;
    min-height: 72px; padding: 14px 18px; width: 100%;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--line); border-radius: 12px;
    font-size: 1.05rem;
  }
  .opt:hover { border-color: var(--orient); }
  .opt .mark {
    flex: 0 0 36px; height: 36px; border: 3px solid var(--orient);
    display: grid; place-items: center; background: var(--paper);
  }
  .opt.multi .mark { border-radius: 8px; }
  .opt.single .mark { border-radius: 50%; }
  .opt .mark svg { width: 22px; height: 22px; visibility: hidden; }
  .opt[aria-pressed="true"] { border-color: var(--orient); background: var(--blue-soft); }
  .opt[aria-pressed="true"] .mark { background: var(--orient); }
  .opt[aria-pressed="true"] .mark svg { visibility: visible; }
  .opt b { display: block; font-weight: 700; }
  .opt small { display: block; color: var(--muted); font-size: .9rem; line-height: 1.4; }

  /* Results */
  .picks { display: grid; gap: 20px; }
  .pick {
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
    border-top: 8px solid var(--orient); padding: 24px; display: grid; gap: 14px;
  }
  .pick.free { border-top-color: var(--free); }
  .pick-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: baseline; justify-content: space-between; }
  .price { font-weight: 900; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .tag {
    display: inline-block; padding: 2px 12px; border-radius: 999px; font-size: .85rem; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase;
  }
  .tag.free { background: var(--free-soft); color: var(--free); }
  .tag.paid { background: var(--blue-soft); color: var(--orient); }
  .tag.have { background: var(--amber-soft); color: #6B4E00; }
  .why { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
  .total {
    background: var(--midnight); color: #fff; border-radius: 14px; padding: 22px 24px;
    display: grid; gap: 8px;
  }
  .total h2 { color: var(--amber); }
  .total p { color: #fff; }
  .total .big { font-size: 1.5rem; font-weight: 900; font-variant-numeric: tabular-nums; }

  .setup { display: grid; gap: 16px; }
  label.devlabel { font-weight: 700; display: block; margin-bottom: 8px; }
  select {
    font: inherit; font-size: 1.05rem; min-height: 60px; width: 100%; max-width: 480px;
    border: 3px solid var(--orient); border-radius: 10px; padding: 8px 12px; background: var(--paper); color: var(--ink);
  }
  details {
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  summary {
    list-style: none; cursor: pointer; padding: 20px 24px; min-height: 72px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    font-weight: 900; font-size: 1.15rem; color: var(--orient);
  }
  summary::-webkit-details-marker { display: none; }
  summary .chev {
    flex: 0 0 auto; font-size: .9rem; font-weight: 700; color: var(--ink);
    background: var(--amber); border-radius: 8px; padding: 4px 12px;
  }
  details[open] summary { border-bottom: 1px solid var(--line); background: var(--blue-soft); }
  details[open] summary .chev::after { content: "Hide steps"; }
  details:not([open]) summary .chev::after { content: "Show steps"; }
  .steps-body { padding: 20px 24px 24px; display: grid; gap: 18px; }
  .phase { font-weight: 900; color: var(--midnight); font-size: 1.05rem; }
  ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 14px; }
  ol.steps li { counter-increment: s; display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: start; }
  ol.steps li::before {
    content: counter(s); width: 44px; height: 44px; border-radius: 50%;
    background: var(--orient); color: #fff; font-weight: 900; display: grid; place-items: center;
  }
  .web { font-weight: 700; color: var(--orient); word-break: break-word; }
  .note {
    background: var(--amber-soft); border-left: 6px solid var(--amber); border-radius: 8px;
    padding: 14px 16px; display: grid; gap: 6px;
  }
  .note strong { color: #5A4200; }
  .safety { display: grid; gap: 10px; }
  .contact {
    background: var(--paper); border: 3px solid var(--amber); border-radius: 14px; padding: 22px 24px;
    display: grid; gap: 6px;
  }
  .contact .phone { font-size: 1.5rem; font-weight: 900; color: var(--orient); font-variant-numeric: tabular-nums; user-select: all; }
  footer { text-align: center; color: var(--muted); font-size: .85rem; display: grid; gap: 4px; }
  @media (max-width: 520px) {
    html { font-size: 18px; }
    .panel, .pick { padding: 22px 18px; }
    .row .btn { flex: 1 1 100%; }
    .row.split { flex-direction: column-reverse; align-items: stretch; }
  }

  nav.tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    max-width: 760px; margin: 20px auto 0;
  }
  .tab {
    min-height: 64px; padding: 10px 14px; border-radius: 12px; font-weight: 900; font-size: 1.05rem;
    background: var(--paper); color: var(--orient); border: 3px solid var(--orient);
  }
  .tab[aria-current="page"] { background: var(--orient); color: #fff; }
  .tab:focus-visible, .chip:focus-visible { outline: 4px solid var(--amber); outline-offset: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    min-height: 52px; padding: 8px 18px; border-radius: 999px; font-weight: 700; font-size: 1rem;
    background: var(--paper); color: var(--ink); border: 3px solid var(--line);
  }
  .chip:hover { border-color: var(--orient); }
  .chip[aria-pressed="true"] { background: var(--orient); color: #fff; border-color: var(--orient); }
  .count { font-weight: 700; margin-top: -8px; }
  .fa-head { display: grid; gap: 6px; }
  .fa-name { font-weight: 900; color: var(--orient); font-size: 1.15rem; }
  .fa-what { font-weight: 400; color: var(--ink); font-size: .95rem; line-height: 1.45; }
  .fa-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag.acct { background: #EEF0F2; color: var(--muted); text-transform: none; letter-spacing: 0; }
  .tag.only { background: var(--amber-soft); color: #6B4E00; text-transform: none; letter-spacing: 0; }
  details.freeapp summary { align-items: flex-start; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--orient); font-weight: 900; text-decoration: underline; text-underline-offset: 3px; font-size: 1rem; }
  @media (max-width: 520px) {
    summary { flex-direction: column; align-items: stretch; }
    summary .chev { align-self: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }

  /* ===== Mobile and tablet polish ===== */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  button, select, summary, a { touch-action: manipulation; -webkit-tap-highlight-color: rgba(0,81,135,.15); }
  body {
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    padding-bottom: calc(48px + env(safe-area-inset-bottom));
  }
  header.brand { margin-left: calc(-1 * max(16px, env(safe-area-inset-left))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right))); }
  .contact .phone a { color: inherit; text-decoration: none; }
  @media (pointer: coarse) { .contact .phone a::after { content: "Tap to call"; display: block; font-size: .8rem; font-weight: 700; color: var(--muted); } }
  .opt, .chip, .tab, .btn { -webkit-user-select: none; user-select: none; }

  main.wrap { margin-top: 16px; }

  /* Keep Back / Next in reach while answering questions */
  .panel > .row.split {
    position: sticky; bottom: 0; z-index: 2;
    background: var(--paper);
    margin: 0 -24px -28px; padding: 14px 24px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    border-radius: 0 0 14px 14px;
  }

  @media (max-width: 520px) {
    header.brand { padding: 10px 16px; border-bottom-width: 4px; }
    header.brand img { width: 130px; }
    nav.tabs { margin-top: 14px; gap: 8px; }
    .tab { min-height: 56px; font-size: .95rem; padding: 8px 10px; }
    .wrap { gap: 18px; }
    h1 { font-size: 1.6rem; }
    .opt { min-height: 64px; padding: 12px 14px; gap: 12px; }
    .opt .mark { flex-basis: 32px; height: 32px; }
    /* Side by side on phones: small Back, big Next */
    .panel > .row.split {
      flex-direction: row; align-items: stretch; flex-wrap: nowrap; gap: 10px;
      margin: 0 -18px -22px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    }
    .panel > .row.split .btn { flex: 1 1 auto; min-height: 60px; padding: 10px 14px; }
    .panel > .row.split .btn-back { flex: 0 0 auto; }
  }

  /* Phones turned sideways: less vertical space */
  @media (max-height: 500px) and (orientation: landscape) {
    header.brand { padding: 6px 16px; }
    header.brand img { width: 110px; }
    .panel > .row.split { position: static; }
  }

  /* Tablets and up: use the width */
  @media (min-width: 768px) {
    .wrap, nav.tabs { max-width: 1040px; }
    .opts { grid-template-columns: 1fr 1fr; }
    .picks { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
    main > div.setup, #steplist, #alsolist { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    main > div.setup details[open], #steplist details[open], #alsolist details[open] { grid-column: 1 / -1; }
    .panel > .row.split .btn { min-width: 200px; }
    main > div.setup details:not([open]) summary, #steplist details:not([open]) summary, #alsolist details:not([open]) summary { flex-direction: column; align-items: stretch; height: 100%; }
    main > div.setup details:not([open]) summary .chev, #steplist details:not([open]) summary .chev, #alsolist details:not([open]) summary .chev { align-self: flex-start; margin-top: auto; }
    main > div.setup details, #steplist details, #alsolist details { height: 100%; }
    main > div.setup, #steplist, #alsolist { align-items: stretch; }
    .contact, .total { text-align: left; }
  }
  @media (min-width: 1200px) {
    main > div.setup { grid-template-columns: 1fr 1fr 1fr; }
  }

}

    </section>
    <p class="count muted">Showing ${list.length} app${list.length === 1 ? "" : "s"}</p>
    <div class="setup">
      ${list.map(a => `

            </span>

      <p>We're happy to help with your internet or answer questions about getting set up.</p>
      <p>Call InfoWest</p>
      <p class="phone"><a href="tel:+14356740165">435-674-0165</a></p>
      <p>Or visit <span class="web">infowest.com</span></p>
    </section>`;

  const fill = (el, a) => {
    const d = DEVICES[state.freeDev];
    const devSteps = freeDeviceSteps(a, state.freeDev);
    const phoneNote = a.phoneFirst && !["tablet", "computer"].includes(state.freeDev)
      ? `<div class="note"><strong>Good to know</strong><p>This station's app is made mainly for phones and tablets. Some stations also have a TV app, so try searching for it. You can also catch local newscasts on Local Now, Haystack News, or with an antenna.</p></div>` : "";
    const onlyNote = a.onlyOn ? `<div class="note"><strong>Good to know</strong><p>This one is only on ${esc(a.onlyOn)}.</p></div>` : "";
    el.innerHTML = `
      ${onlyNote}${phoneNote}
      <p class="phase">Part 1: Get it on your ${esc(d.name)}</p>
      <ol class="steps">${devSteps.map(s => `<li><span>${esc(s)}</span></li>`).join("")}</ol>
      <p class="phase">Part 2: Start watching ${esc(a.name)}</p>
      <ol class="steps">${a.steps.map(s => `<li><span>${esc(s)}</span></li>`).join("")}</ol>
      <p class="muted">Official website: <span class="web">${esc(a.site)}</span></p>`;
  };
  app.querySelectorAll("details.freeapp").forEach(det => {
    det.addEventListener("toggle", () => {
      if (det.open) fill(det.querySelector(".steps-body"), FREE.find(a => a.id === det.dataset.id));
    });
  });
  document.getElementById("freedev").onchange = e => {
    state.freeDev = e.target.value;
    app.querySelectorAll("details.freeapp[open]").forEach(det => fill(det.querySelector(".steps-body"), FREE.find(a => a.id === det.dataset.id)));
  };
  app.querySelectorAll(".chip").forEach(c => c.onclick = () => { state.freeCat = c.dataset.cat; renderFree(); document.getElementById("cat-" + c.dataset.cat).focus(); });
}

const state = { step: -1, answers: {}, view: "quiz", freeCat: "all", freeDev: null };
const app = document.getElementById("app");

function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderWelcome() {
  app.innerHTML = `
    <section class="panel">
      <h1>Find the right TV streaming for you</h1>
      <p class="lead">Streaming means watching TV shows and movies through your internet connection instead of cable or satellite. Some services are free. Others cost a monthly fee.</p>
      <p>Answer 7 easy questions and we'll suggest the best choices for you, with simple setup steps.</p>
      <ul class="facts">
        <li>Takes about 2 minutes</li>
        <li>You can pick more than one answer on some questions</li>
        <li>You can go back and change any answer</li>
      </ul>
      <div class="row"><button class="btn btn-go" id="start">Let's get started</button></div>
    </section>`;
  document.getElementById("start").onclick = () => go(0);
}

function renderQuestion() {
  const q = QUESTIONS[state.step];
  const sel = state.answers[q.id] || [];
  const pct = Math.round((state.step) / QUESTIONS.length * 100);
  app.innerHTML = `
    <section class="panel">
      <div class="progress">
        <span class="progress-label">Question ${state.step + 1} of ${QUESTIONS.length}</span>
        <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
      </div>
      <h2 id="qtitle" tabindex="-1">${esc(q.title)}</h2>
      ${q.multi ? '<span class="hint">Pick all that apply</span>' : '<span class="hint">Pick one</span>'}
      ${q.help ? `<p class="muted">${esc(q.help)}</p>` : ""}
      <div class="opts" role="group" aria-labelledby="qtitle">
        ${q.opts.map(([v, label, sub]) => `
          <button class="opt ${q.multi ? "multi" : "single"}" id="opt-${q.id}-${v}" data-v="${v}" aria-pressed="${sel.includes(v)}">
            <span class="mark">${CHECK}</span>
            <span><b>${esc(label)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</span>
          </button>`).join("")}
      </div>
      <div class="row split">
        <button class="btn btn-back" id="back">Back</button>
        <button class="btn btn-go" id="next" ${sel.length ? "" : "disabled"}>${state.step === QUESTIONS.length - 1 ? "See my results" : "Next"}</button>
      </div>
    </section>`;
  const exclusive = ["none", "nohave"];
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const v = b.dataset.v;
    let cur = state.answers[q.id] || [];
    if (!q.multi) cur = [v];
    else if (cur.includes(v)) cur = cur.filter(x => x !== v);
    else if (exclusive.includes(v)) cur = [v];
    else cur = cur.filter(x => !exclusive.includes(x)).concat(v);
    state.answers[q.id] = cur;
    app.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-pressed", cur.includes(o.dataset.v)));
    document.getElementById("next").disabled = !cur.length;
  });
  document.getElementById("back").onclick = () => go(state.step - 1);
  document.getElementById("next").onclick = () => go(state.step + 1);
  document.getElementById("qtitle").focus({ preventScroll: true });
}

function recommend(a) {
  const likes = a.likes || [];
  const style = (a.style || ["both"])[0];
  const budget = Number((a.budget || ["0"])[0]);
  const ads = (a.ads || ["fine"])[0];
  const have = a.have || [];
  const comfort = (a.comfort || ["mid"])[0];
  const maxPicks = { low: 2, mid: 3, high: 4 }[comfort];

  const scored = Object.entries(SERVICES).map(([id, s]) => {
    let score = 0; const why = [];
    const labels = QUESTIONS[1].opts.reduce((m, [v, l]) => (m[v] = l, m), {});
    likes.forEach(l => { const w = s.likes[l] || 0; score += w * 3; if (w >= 2) why.push(labels[l]); });
    if (style === "live") score += s.live * 2;
    else if (style === "demand") score += s.demand * 2;
    else score += (s.live + s.demand);
    if (ads === "none" && !s.ads) { score += 5; why.push("No commercials"); }
    if (ads === "fewer" && !s.ads) score += 2;
    if (ads === "none" && s.free && s.ads) score -= 4;
    if (s.needs === "library") { if (have.includes("library")) { score += comfort === "low" ? 0 : 3; why.push("Free with your library card"); } else score -= 6; }
    let cost = s.cost; let owned = false;
    if (id === "prime" && have.includes("prime")) { cost = 0; owned = true; score += 10; why.unshift("You already pay for it with Amazon Prime"); }
    if (s.livetv && style === "live") why.push("Works like regular TV with a channel guide");
    if (s.free) why.push("Free, no payment needed");
    return { id, s, score, why: [...new Set(why)].slice(0, 4), cost, owned };
  }).filter(x => x.score > 0);

  scored.sort((x, y) => y.score - x.score || x.cost - y.cost);

  const picks = []; let total = 0;
  // Always start with the best free option (or an already-owned one).
  const bestFree = scored.find(x => x.cost === 0);
  if (bestFree) picks.push(bestFree);
  for (const x of scored) {
    if (picks.length >= maxPicks) break;
    if (picks.includes(x)) continue;
    if (total + x.cost > budget) continue;
    // Only one live TV service at a time.
    if (x.s.livetv && picks.some(p => p.s.livetv)) continue;
    picks.push(x); total += x.cost;
  }
  // Upgrade: if they want live local news or sports and can afford it, lead with YouTube TV.
  if (budget >= 100 && (likes.includes("localnews") || likes.includes("sports")) && style !== "demand" && !picks.some(p => p.id === "youtubetv")) {
    const yt = scored.find(x => x.id === "youtubetv");
    if (yt) {
      const others = picks.filter(p => !p.s.livetv);
      let t = yt.cost; const keep = [];
      for (const p of others) { if (keep.length < maxPicks - 1 && t + p.cost <= budget + 5) { keep.push(p); t += p.cost; } }
      picks.length = 0; picks.push(yt, ...keep); total = t;
    }
  }
  const alsos = scored.filter(x => !picks.includes(x) && x.cost <= Math.max(budget, 0) && !(x.s.livetv && picks.some(p => p.s.livetv))).slice(0, 3);
  return { picks, total, alsos, likes, budget, have, devices: a.device || ["none"] };
}

function renderResults() {
  const r = recommend(state.answers);
  const devList = r.devices;
  const firstDev = devList[0];
  const devOptions = Object.entries(DEVICES).map(([k, d]) => `<option value="${k}" ${k === firstDev ? "selected" : ""}>${esc(d.name)}${devList.includes(k) ? " (yours)" : ""}</option>`).join("");

  const pickCard = p => `
    <article class="pick ${p.cost === 0 ? "free" : ""}">
      <div class="pick-head">
        <h3>${esc(p.s.name)}</h3>
        <span>${p.owned ? '<span class="tag have">You already have this</span>' : p.s.free ? '<span class="tag free">Free</span>' : '<span class="tag paid">Paid</span>'}</span>
      </div>
      <div class="price">${esc(p.owned ? "Included with your Prime membership" : p.s.price)}</div>
      ${p.s.priceNote ? `<p class="muted">${esc(p.s.priceNote)}</p>` : ""}
      <p>${esc(p.s.blurb)}</p>
      ${p.why.length ? `<ul class="why">${p.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
    </article>`;

  const totalText = r.total === 0 ? "$0 a month" : `About $${r.total} a month`;
  const shared = r.have.includes("shared");

  app.innerHTML = `
    <section class="panel">
      <h1 id="rtitle" tabindex="-1">Your streaming picks</h1>
      <p class="lead">Based on your answers, here ${r.picks.length === 1 ? "is the service" : `are the ${r.picks.length} services`} we think you'll enjoy most. Start with the first one. You can always add more later.</p>
    </section>

    <div class="picks">${r.picks.map(pickCard).join("")}</div>

    <section class="total">
      <h2>Your estimated monthly cost</h2>
      <p class="big">${totalText}</p>
      <p>${r.total === 0 ? "Everything above is free. You'll never be asked for a payment card." : "Paid services can be canceled any time from the service's website. Prices are approximate."}</p>
    </section>

    ${r.likes.includes("localnews") ? `
    <div class="note"><strong>Tip for free local channels</strong>
      <p>An indoor TV antenna (about $25 to $40) plugged into your TV can pick up local stations like KSL, KUTV, and ABC 4 for free, with no internet needed. Reception depends on where you live.</p></div>` : ""}
    ${shared ? `
    <div class="note"><strong>About shared accounts</strong>
      <p>If family shares a Netflix account with you, ask them to sign you in. Netflix may ask them to add you as an "extra member" for a small monthly fee if you live in a different home.</p></div>` : ""}

    <section class="panel setup">
      <h2>Step-by-step setup</h2>
      <p>First, choose the device you'll use. The steps below will change to match it.</p>
      <div>
        <label class="devlabel" for="devpick">I'm setting up on:</label>
        <select id="devpick">${devOptions}</select>
      </div>
      <div class="note"><strong>Before you start</strong>
        <p>Have a pen and paper ready to write down each email and password you create. Keep it somewhere safe, like a kitchen drawer.</p></div>
      <div id="steplist" class="setup"></div>
    </section>

    ${r.alsos.length ? `
    <section class="panel">
      <h2>Other good choices</h2>
      <p class="muted">These also fit your answers. Tap one to see its setup steps. They follow the device you picked above.</p>
      <div id="alsolist" class="setup"></div>
    </section>` : ""}

    <section class="panel">
      <h2>Want even more free TV?</h2>
      <p>We've put together ${FREE.length} free apps for movies, live channels, national news, and Utah local news, each with setup steps.</p>
      <div class="row"><button class="btn btn-go" id="gofree">See all free TV apps</button></div>
    </section>

    <section class="panel safety">
      <h2>Stay safe while streaming</h2>
      <ul class="facts">
        <li>Streaming companies will never call you and ask for your password or payment. If someone calls asking, hang up.</li>
        <li>Only sign up on the official websites listed above.</li>
        <li>If you sign up for a free trial, write down the date it ends so you aren't charged unexpectedly.</li>
        <li>Streaming works best with a good internet connection. If shows keep stopping to load, your internet may need a checkup.</li>
      </ul>
    </section>

    <section class="contact">
      <h2>Need a hand?</h2>
      <p>We're happy to help with your internet or answer questions about getting set up.</p>
      <p>Call InfoWest</p>
      <p class="phone"><a href="tel:+14356740165">435-674-0165</a></p>
      <p>Or visit <span class="web">infowest.com</span></p>
    </section>

    <div class="row split">
      <button class="btn btn-back" id="change">Change my answers</button>
      <button class="btn btn-go" id="restart">Start over</button>
    </div>`;

  const drawSteps = dev => {
    const d = DEVICES[dev];
    const block = (p, i, isAlso) => {
      const appName = p.id === "kanopy" ? "Kanopy" : p.id === "disney" ? "Disney+" : p.s.name.replace("The Roku Channel", "The Roku Channel");
      const site = p.s.site.split(" ")[0];
      const skipInstall = p.id === "roku" && dev === "roku";
      const devSteps = skipInstall ? ["The Roku Channel is already on your Roku Home screen. Nothing to install."] : d.steps(appName, site);
      return `
      <details ${i === 0 && !isAlso ? "open" : ""}>
        <summary>${isAlso ? `<span class="fa-head"><span class="fa-name">${esc(p.s.name)}</span><span class="fa-what">${esc(p.s.free ? "Free" : p.s.price)}. ${esc(p.s.blurb)}</span></span>` : `<span>${esc(p.s.name)}</span>`}<span class="chev" aria-hidden="true"></span></summary>
        <div class="steps-body">
          <p class="phase">Part 1: Get the app on your ${esc(d.name)}</p>
          <ol class="steps">${devSteps.map(s => `<li><span>${esc(s)}</span></li>`).join("")}</ol>
          <p class="phase">Part 2: Set up ${esc(p.s.name)}</p>
          <ol class="steps">${p.s.steps.map(s => `<li><span>${esc(s)}</span></li>`).join("")}</ol>
          <p class="muted">Official website: <span class="web">${esc(p.s.site)}</span></p>
        </div>
      </details>`;
    };
    document.getElementById("steplist").innerHTML = r.picks.map((p, i) => block(p, i, false)).join("");
    const al = document.getElementById("alsolist");
    if (al) al.innerHTML = r.alsos.map((p, i) => block(p, i, true)).join("");
  };
  const sel = document.getElementById("devpick");
  sel.onchange = () => drawSteps(sel.value);
  drawSteps(firstDev);
  document.getElementById("change").onclick = () => go(0);
  document.getElementById("gofree").onclick = () => setView("free");
  document.getElementById("restart").onclick = () => { state.answers = {}; go(-1); };
  document.getElementById("rtitle").focus({ preventScroll: true });
}

function setTabs() {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.view === state.view ? "page" : "false"));
}
function setView(v) {
  state.view = v;
  try { history.replaceState(null, "", v === "free" ? "#free" : "#quiz"); } catch (e) {}
  setTabs();
  if (v === "free") { renderFree(); window.scrollTo(0, 0); document.getElementById("ftitle").focus({ preventScroll: true }); }
  else go(state.step);
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => setView(t.dataset.view));

function go(step) {
  state.step = step;
  state.view = "quiz"; setTabs();
  if (step < 0) renderWelcome();
  else if (step >= QUESTIONS.length) renderResults();
  else renderQuestion();
  window.scrollTo(0, 0);
}
if (location.hash === "#free") setView("free"); else go(-1);
</script>
